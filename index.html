<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/css/fastbootstrap.min.css" rel="stylesheet"
        integrity="sha256-V6lu+OdYNKTKTsVFBuQsyIlDiRWiOmtC8VQ8Lzdm2i4=" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body onload="setup()">

    <div class="container-fluid bg-light p-0">
        <header class="h2 py-2 m-0 text-center  bg-warning text-white">Product Manager</header>
        <div class="layout row">
            <div class="functions col-12 bg-dark align-content-center justify-item-center">
                <button type="button" class="btn btn-primary p-2 my-2" id="btnNewProduct" onclick="showProductForm()">New
                    Product</button>
                <button type="button" class="btn btn-info p-2 my-2 " id="btnShowProduct" onclick="showProductList()">My
                    Products</button>

            </div>
            <div class="content col-12">
                <!--product Form Start -->
                <div class="container border-start border-2 border-dotted " id="productForm">
                    <form action="">
                        <fieldset
                            class="form-control border-0 bg-secondary bg-opacity-10 border border-info border-start-0 rounded-end ">
                            <legend class="text-center bg-secondary-subtle p-2 font-monospace " id="pTitle">
                            </legend>
                          <div class="formcontent row px-3">
                            <div class="formLeft col-9">

                                <label for="prodName" class="form-label mt-2">Poduct Name:</label>
                                <input type="text" name="prodName" id="prodName"
                                    class="form-control w-75 border border-dark-subtle border-dotted">
                                <label for="prodDesc" class="form-label mt-2">Description:</label>
                                <textarea name="prodDesc" id="prodDesc" cols="30" rows="6"
                                    class="form-control border-dark-subtle w-75 border border-dotted"></textarea>
                                <div class="row mt-2">
                                    <div class="price col-4">
                                        <label for="prodPrice" class="form-label">Price</label>
                                        <input type="number" name="prodPrice" id="prodPrice"
                                            class="form-control w-50 border border-dark-subtle border-dotted">

                                    </div>
                                    <div class="image col-4">
                                        <label for="prodImage" class="form-label">Image</label>
                                        <input type="file" name="prodImage" id="prodImage"
                                            class="form-control  border border-dark-subtle border-dotted">
                                    </div>

                                </div>

                                <button type="submit" id="btnSubmit"
                                    class="mt-5 mb-4 px-5 btn btn-success border border-dotted">Add</button>
                            </div>
                            <div class="formRight col-3 align-content-center">
                                <div class="preview border border-black border-solid h-75 "> Image
                                    <img src="" alt="" id="imgView" >
                                </div>

                            </div>
</div>

                        </fieldset>

                    </form>
                </div>
                <!-- Product Form End  -->
                <!-- Display Product Block Start -->
                <div class="mx-5 border-start border-2 border-dotted" id="productList">
                    <p class="text-center bg-secondary-subtle p-2 h4 font-monospace">Product List</p>

                    <table class="table">
                        <thead class="thead-light">
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Title</th>
                                <th scope="col">Status</th>
                                <th scope="col">Priority</th>
                                <th scope="col">Created </th>
                                <th scope="col">Updated</th>
                                <th scope="col"></th>
                                <th scope="col"></th>
                            </tr>
                        </thead>
                        <tbody id="taskList">
                            <!-- <tr>
                                <td scope="row" id="tid">1</td>
                                <td id="tTitle">Mark</td>
                                <td id="tStatus">Done</td>
                                <td id="tPriority">Low</td>
                                <td id="tEdit"><button id="btnEdit" class="btn btn-warning">Edit</button></td>
                                <td id="tDelete"><button id="btnDelete" class="btn btn-danger">Delete</button></td>
                            </tr> -->

                        </tbody>
                    </table>
                </div>
                <!-- Display Task Block End  -->

            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        function setup() {
           
            document.getElementById("productForm").style.display = "none";
            document.getElementById("productList").style.display = "block";

        }

        function showProductForm()
        {
            const prodForm = document.getElementById("productForm").style.display="block";
            const pTitle = document.getElementById("pTitle").innerText="Add Product Form";
            const btnSubmit=document.getElementById("btnSubmit");
            btnSubmit.addEventListener("click",addProduct);
            btnSubmit.innerText="Add";
            document.getElementById("productList").style.display="none";
            
        }

        function addProduct()
        {
            console.log("added..");
        }
    </script>

</body>

</html>
